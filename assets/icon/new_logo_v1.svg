<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Glassmorphism gradient for the main "C" -->
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.9"/>
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0.3"/>
    </linearGradient>
    
    <!-- Accent cyan gradient for highlights -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00E5A0;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00B8FF;stop-opacity:1"/>
    </linearGradient>
    
    <!-- Inner glow filter -->
    <filter id="innerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feComposite in="blur" in2="SourceGraphic" operator="out" result="glow"/>
      <feFlood flood-color="#00E5A0" flood-opacity="0.4"/>
      <feComposite in2="glow" operator="in"/>
      <feComposite in="SourceGraphic" operator="over"/>
    </filter>
    
    <!-- Glass highlight overlay -->
    <linearGradient id="glassHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.3"/>
      <stop offset="40%" style="stop-color:#FFFFFF;stop-opacity:0.1"/>
      <stop offset="60%" style="stop-color:#FFFFFF;stop-opacity:0.0"/>
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0.1"/>
    </linearGradient>
    
    <!-- Subtle shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Base circle with subtle glass effect -->
  <circle cx="512" cy="512" r="480" fill="url(#glassGradient)" filter="url(#softShadow)"/>
  
  <!-- Glass border -->
  <circle cx="512" cy="512" r="480" fill="none" stroke="white" stroke-width="2" opacity="0.15"/>
  
  <!-- Main "C" shape - glassmorphism style -->
  <path d="M680 280 
           C680 200 615 135 512 135 
           C409 135 344 200 344 303 
           C344 360 370 410 420 445 
           L420 580 
           C370 615 344 665 344 722 
           C344 825 409 890 512 890 
           C615 890 680 825 680 722 
           L680 580" 
        fill="none" 
        stroke="url(#glassGradient)" 
        stroke-width="80" 
        stroke-linecap="round"
        filter="url(#innerGlow)"/>
  
  <!-- Inner highlight on the C -->
  <path d="M680 280 
           C680 200 615 135 512 135 
           C409 135 344 200 344 303 
           C344 360 370 410 420 445 
           L420 580 
           C370 615 344 665 344 722 
           C344 825 409 890 512 890 
           C615 890 680 825 680 722 
           L680 580" 
        fill="none" 
        stroke="url(#glassHighlight)" 
        stroke-width="40" 
        stroke-linecap="round"
        opacity="0.6"/>
  
  <!-- Accent dot - representing the "honest voice" / tier indicator -->
  <circle cx="680" cy="280" r="18" fill="url(#accentGradient)">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Subtle inner ring on the accent dot -->
  <circle cx="680" cy="280" r="12" fill="none" stroke="white" stroke-width="2" opacity="0.5"/>
  
  <!-- Small accent arc at bottom of C -->
  <path d="M420 722 C420 760 440 790 480 805" 
        fill="none" 
        stroke="url(#accentGradient)" 
        stroke-width="6" 
        stroke-linecap="round" 
        opacity="0.8"/>
</svg>