name: candor
description: "On-device two-tier SLM assistant that tells you when it's holding back."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  android_intent_plus: ^6.1.0
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  llama_flutter_android: ^0.2.6
  path_provider: ^2.1.6

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#A64B2A"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true
